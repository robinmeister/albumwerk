# Entwicklungs-/Demo-Instanz: App mit Demo-Daten + Mailpit als SMTP-Fake.
# Am einfachsten über make starten:  make dev   (frisch: make dev-reset)
#
# - App:             http://localhost:8091   (admin@demo.test / demo123456)
# - PocketBase:      http://localhost:8091/_/ (gleiche Zugangsdaten)
# - Mailpit (Mails): http://localhost:8025
#
# Die Daten liegen in einem eigenen Docker-Volume (pb_data_dev) und sind
# komplett getrennt von einer Produktions-Instanz (./pb_data).
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8091}:8090"
    volumes:
      - pb_data_dev:/pb/pb_data
    environment:
      # Superuser für das PocketBase-Backend (/_/)
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@demo.test}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-demo123456}
      # Demo-Daten beim ersten Start anlegen (pb_hooks/seed_demo.pb.js)
      PB_SEED_DEMO: "1"
      # Mail-Einstellungen automatisch auf mailpit zeigen lassen
      PB_DEV_SMTP_HOST: mailpit
      PB_DEV_SMTP_PORT: "1025"
      PB_DEV_APP_URL: http://localhost:${APP_PORT:-8091}
      # Support-Weiterleitung an den "Hersteller" — im Dev-Setup landet die
      # Meldung in Mailpit, solange keine Control-Plane gesetzt ist.
      SAAS_CONTROL_URL: ${SAAS_CONTROL_URL:-}
      VENDOR_SUPPORT_EMAIL: ${VENDOR_SUPPORT_EMAIL:-vendor@demo.test}

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025" # Web-UI; SMTP läuft nur intern im Docker-Netz

volumes:
  pb_data_dev:
