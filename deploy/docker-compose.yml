# Albumwerk — Self-Hosting für Endkunden (fertiges Image, kein Quellcode nötig).
#
# Schnellstart:
#   1. Diese drei Dateien in einen Ordner legen: docker-compose.yml, Caddyfile, .env
#      (.env aus .env.example erstellen und ausfüllen)
#   2. docker compose up -d
#   3. http://SERVER-IP:8090 öffnen und dem Einrichtungs-Assistenten folgen.
#
# Update:  docker compose pull && docker compose up -d
# Backup:  automatisch nächtlich in ./pb_data/backups/ (Details: Doku → Backup)
services:
  app:
    image: gitea.robinhm.de/robinmeister/albumwerk:latest
    restart: unless-stopped
    ports:
      # Für Ersteinrichtung/lokalen Zugriff. Läuft alles über die eigene
      # Domain (Caddy unten), kann diese Zeile entfernt werden.
      - "${APP_PORT:-8090}:8090"
    volumes:
      - ./pb_data:/pb/pb_data
    environment:
      # Superuser wird beim ersten Start automatisch angelegt (siehe .env).
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-}

  # HTTPS mit eigener Domain: Domain im Einrichtungs-Assistenten eintragen,
  # DNS-A-Record auf die Server-IP zeigen lassen, Ports 80/443 öffnen —
  # das Zertifikat holt Caddy automatisch (On-Demand-TLS, siehe Caddyfile).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
