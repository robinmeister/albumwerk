# Control-Plane lokal betreiben/testen. Produktiv läuft sie als Coolify-App
# (siehe saas/README.md). Konfiguration kommt aus saas/.env (eine Ebene höher).
#
# Start:  docker compose --env-file ../.env up -d --build
# (--env-file ist nötig, damit ${CONTROL_SUPERUSER_*} unten aufgelöst wird.)
services:
  control:
    build: .
    restart: unless-stopped
    ports:
      - "${CONTROL_PORT:-8095}:8090"
    volumes:
      - control_data:/pb/pb_data
    env_file:
      - ../.env
    environment:
      PB_SUPERUSER_EMAIL: ${CONTROL_SUPERUSER_EMAIL:-}
      PB_SUPERUSER_PASSWORD: ${CONTROL_SUPERUSER_PASSWORD:-}

volumes:
  control_data:
